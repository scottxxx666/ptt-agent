[project]
name = "ptt-agent"
version = "0.1.0"
description = "Watch LE SSERAFIM YouTube, translate titles, post to PTT"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.65.2",
    "PyPtt>=1.3.3",
    "python-dotenv>=1.0",
    "python-socks[asyncio]>=3.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptt_agent"]
